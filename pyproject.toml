[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "open-quant-lab"
version = "0.5.2"
description = "A fully open research pipeline for trading strategies, built around tests that cannot be gamed"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "David DeConti"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "pyarrow>=12", "certifi"]

[project.scripts]
oql = "oql.cli:main"

[tool.setuptools]
packages = ["oql", "oql.projects"]

[tool.setuptools.package-data]
oql = ["web/*.html", "web/*.js"]
